<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration form</title>

  <!-- Figtree font; the CSS falls back to system fonts if it doesn't load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- novalidate turns off the browser's default popups so script.js can show inline errors -->
  <form id="registration-form" novalidate>
    <h1>Registration</h1>

    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" autocomplete="name">
      <p class="error" id="name-error"></p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <p class="error" id="email-error"></p>
    </div>

    <!-- Phone and date of birth sit side by side on wider screens -->
    <div class="row">
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">
        <p class="error" id="phone-error"></p>
      </div>

      <div class="field">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" name="dob" autocomplete="bday">
        <p class="error" id="dob-error"></p>
      </div>
    </div>

    <!-- Radio buttons styled as pills; each input sits right before its label so CSS can style the checked one -->
    <fieldset class="field">
      <legend>Gender</legend>
      <div class="pills">
        <input type="radio" id="g-male" name="gender" value="male">
        <label for="g-male">Male</label>

        <input type="radio" id="g-female" name="gender" value="female">
        <label for="g-female">Female</label>

        <input type="radio" id="g-other" name="gender" value="other">
        <label for="g-other">Other</label>
      </div>
      <p class="error" id="gender-error"></p>
    </fieldset>

    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" autocomplete="street-address"></textarea>
      <p class="error" id="address-error"></p>
    </div>

    <button type="submit">Register</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
